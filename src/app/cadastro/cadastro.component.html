<form action class="formulario">

        <label for="Nome" class="label1">Nome:</label>
        <input type class="input1" name="Nome" id="Nome">

        <label for="CPF" class="label1">CPF:</label>
        <input type class="input1" name="CPF" id="CPF">

        <label for="Data de nascimento" class="label1">Data de nascimento:</label>
        <input type class="input1" name="Data de nascimento" id="Data de nascimento">

        <label for="Telefone" class="label1">Telefone:</label>
        <input type class="input1" name="Telefone" id="Telefone">

        <label for="Como conheceu a barbearia" class="label1">Como conheceu a barbearia:</label>
        <input type class="input1" name="Como conheceu a barbearia" id="Como conheceu a barbearia">
        
        <!-- <button class="botao"> Salvar </button> -->

        <button mat-raised-button>Cadastrar</button>

    </form>


  <mat-form-field appearance="fill">
    <mat-label>Nome Completo</mat-label>
    <input matInput placeholder="Placeholder">
    <mat-icon matSuffix>*</mat-icon>
    <mat-hint>Nome e sobrenome</mat-hint>
  </mat-form-field>


  <mat-form-field appearance="fill">
    <mat-label>CPF</mat-label>
    <input matInput placeholder="Placeholder">
    <mat-icon matSuffix>*</mat-icon>
    <mat-hint>000.000.000-00</mat-hint>
  </mat-form-field>


  <mat-form-field appearance="fill">
    <mat-label>Data de Nascimento</mat-label>                        <!-- Colocar date picker --> 
    <input matInput placeholder="Placeholder">
    <mat-icon matSuffix>*</mat-icon>
    <mat-hint>00/00/0000</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Como conheceu a barbearia</mat-label>
    <input matInput placeholder="Placeholder">
    <mat-icon matSuffix>*</mat-icon>
    <mat-hint>Livre</mat-hint>
  </mat-form-field>
